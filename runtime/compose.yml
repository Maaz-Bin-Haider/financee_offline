services:
  db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    pull_policy: never
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    pull_policy: never
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  web:
    image: financee-offline:0.2.0-phase2
    pull_policy: never
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    env_file: ${RUNTIME_ENV_FILE}
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /customer/Data/media
      SECURE_COOKIES: 'False'
    volumes: ["${CUSTOMER_DIR}:/customer", "static:/app/staticfiles"]
    depends_on:
      db: {condition: service_healthy}
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    pull_policy: never
    ports: ["127.0.0.1:${HTTP_PORT}:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro", "static:/app/staticfiles:ro"]
    depends_on: [web]
volumes:
  database:
  static:
