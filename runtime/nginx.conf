events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server {
  listen 80;
  server_name localhost 127.0.0.1;
  client_max_body_size 32m;
  # Legacy templates require inline handlers/styles; all resource/network origins
  # remain local. This also prevents an accidental future CDN dependency.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'" always;
  location /static/ { alias /app/staticfiles/; }
  location / { proxy_pass http://web:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
 }
}
