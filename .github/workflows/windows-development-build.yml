name: Windows development build (not a release)
run-name: Unsigned Windows x64 development build — ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-development-build
  cancel-in-progress: false
jobs:
  linux-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Host setup and launcher guards
        run: python -m unittest tests.test_installer tests.test_launcher
      - name: Cache exact AMD64 dependency images on this disposable runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          refs=[line.split('image: ',1)[1].strip() for line in Path('runtime/compose.yml').read_text().splitlines() if 'image: ' in line and '@sha256:' in line]
          for ref in dict.fromkeys(refs):
              subprocess.run(['docker','pull','--platform','linux/amd64',ref],check=True)
          PY
      - name: Build independent Linux AMD64 engine
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          docker build --platform linux/amd64 --label org.opencontainers.image.revision="$GITHUB_SHA" -f runtime/Dockerfile -t "financee-offline:$version" .
      - name: Verify Django checks and fresh database tests in disposable CI stack
        shell: bash
        run: |
          set -euo pipefail
          python runtime/dev.py init --stack test
          python runtime/dev.py up --stack test
          python runtime/dev.py check --stack test
          python runtime/dev.py test --stack test
      - name: Stage and export verified AMD64 program payload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_installer_program.py --architecture amd64 --engine-image "financee-offline:$(cat VERSION)" --output .runtime/phase6-program-amd64
          python scripts/export_installer_payload.py --program .runtime/phase6-program-amd64 --output .runtime/phase6-payload-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase6-amd64-program-payload
          path: .runtime/phase6-payload-amd64/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  windows-package:
    needs: linux-payload
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phase6-amd64-program-payload
          path: .runtime/phase6-payload-amd64
      - name: Install pinned native build dependencies
        run: python -m pip install -r installer/windows/requirements-build.txt
      - name: Windows host guards (no Docker or WSL mutation)
        run: python -m unittest tests.test_installer tests.test_launcher
      - name: Freeze both Windows programs, check bundles and compile Inno setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Hosted runner is missing its documented Inno Setup compiler.' }
          python scripts/build_windows_installer.py --program .runtime/phase6-payload-amd64/program --archive .runtime/phase6-payload-amd64/financee-offline-runtime-amd64.tar --iscc $iscc
          if ($LASTEXITCODE -ne 0) { throw 'Windows development build failed.' }
      - name: Collect unsigned installer and matching runtime archive
        run: python scripts/package_windows_development.py --archive .runtime/phase6-payload-amd64/financee-offline-runtime-amd64.tar --output .runtime/phase6-windows-delivery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Financee-Offline-Windows-x64-Development-${{ github.sha }}
          path: .runtime/phase6-windows-delivery/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
